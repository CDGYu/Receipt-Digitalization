# Redis config for the Receipt Review launcher (bundled, local single-user use).
#
# This is NOT the stock redis.windows.conf. It is deliberately minimal and
# tuned for one job: being the RQ queue broker + progress store for a single
# machine that the launcher starts and stops. It is not a shared or networked
# Redis and must not be treated as one.

# Loopback only. Nothing on this box should be reachable off the machine, and
# binding to 127.0.0.1 (not 0.0.0.0) is what guarantees that regardless of the
# host firewall.
bind 127.0.0.1
port 6379

# No password: the server is loopback-only and single-user. A password here
# would have to be shared with the .env REDIS_URL anyway, adding a moving part
# without adding protection on a loopback socket.
protected-mode yes

# Queue data is transient. RQ jobs and the per-receipt progress keys are
# rebuildable state, never the source of truth (the database is), so we do not
# want Redis spending IO on background saves or refusing writes when a save
# fails. Disable RDB snapshotting entirely.
save ""
stop-writes-on-bgsave-error no

# Keep the working directory inside the project's var/ so any file Redis does
# write (the dump it won't make, plus its logs) stays with the app and is
# cleaned up with it. The launcher sets --dir explicitly too; this is the
# fallback.
appendonly no

# Modest memory ceiling with an eviction policy suited to a queue: if it ever
# fills, drop the least-recently-used volatile keys rather than erroring. In
# practice a single-user receipt queue never approaches this.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Quiet by default. The launcher captures stdout; notice level keeps startup
# and shutdown lines without per-command noise.
loglevel notice
