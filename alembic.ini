# Alembic configuration for the seven-table receipt schema (spec §6).
#
# Usage (the console script is not required):
#   python -m alembic upgrade head                    # uses DATABASE_URL, else sqlite:///receipts.db
#   python -m alembic -x db_url=sqlite:///scratch.db upgrade head
#   python -m alembic revision --autogenerate -m "..."
#   python -m alembic upgrade head --sql              # offline: emit SQL only
#
# The database URL is resolved in alembic/env.py, not here -- see the docstring
# there for the precedence. `sqlalchemy.url` is intentionally left unset so that
# nothing in version control points at a real database.

[alembic]
script_location = %(here)s/alembic

# Both the repo root (for `config`) and src/ (for `receipts`) go on sys.path, so
# migrations run from a plain checkout without an editable install.
path_separator = space
prepend_sys_path = . src

# Resolved at runtime by env.py: -x db_url=... > DATABASE_URL > sqlite:///receipts.db
# sqlalchemy.url =


# Logging configuration, consumed by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
