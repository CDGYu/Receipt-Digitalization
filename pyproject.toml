[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts"
version = "0.1.0"
description = "VLM-based receipt digitization: extraction, deterministic validation, and confidence routing."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "sqlalchemy>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.8",
    "httpx>=0.27",
]
pipeline = [
    "pillow>=10",
    "opencv-python-headless>=4.9",
    "pillow-heif>=0.16",
    "pypdfium2>=4",
    "openpyxl>=3.1",
]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
postgres = ["psycopg[binary]>=3"]
# The RQ queue worker. Optional and imported lazily (receipts/worker.py), so the
# offline test suite and a base install need neither package.
worker = ["rq>=1.16", "redis>=5"]
# The FastAPI review service. Optional so a base install and the worker stay
# light; the API tests importorskip on it exactly as the pipeline tests do.
api = ["fastapi>=0.110", "python-multipart>=0.0.9", "itsdangerous>=2", "uvicorn>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The existing codebase makes a few deliberate, consistent style choices that
# these pyupgrade/bugbear rules would otherwise flag. The rules stay enabled in
# general; we only opt out of the patterns the code intentionally uses, so no
# existing source under src/, eval/, or tests/ needs to change.
ignore = [
    "UP035",  # imports Callable/Iterable from `typing` on purpose (not collections.abc)
    "UP037",  # quoted type annotations are used intentionally
    "UP042",  # `class X(str, Enum)` is the project's chosen enum base pattern
]

[tool.ruff.lint.per-file-ignores]
# Re-exports: names imported to build a module's public API are not "unused".
"__init__.py" = ["F401"]
# Intentional zip() over sequences known to be equal length in the align logic.
"src/receipts/validate/rules.py" = ["B905"]
# Test-file conveniences: pragmatic import order and a deliberate zip().
"tests/test_eval_metrics.py" = ["I001", "B905"]
# Imports kept for readability / import-smoke checks in this test module.
"tests/test_extractor.py" = ["F401"]
# FastAPI's dependency-injection idiom is `param = Depends(...)` in the
# signature default -- exactly what flake8-bugbear's B008 flags. It is
# correct here, not a mistake: Depends() is never called eagerly.
"tests/test_auth.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
