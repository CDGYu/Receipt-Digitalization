[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts"
version = "0.1.0"
description = "VLM-based receipt digitization: extraction, deterministic validation, and confidence routing."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "sqlalchemy>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.8",
    "httpx>=0.27",
]
pipeline = [
    "pillow>=10",
    "opencv-python-headless>=4.9",
    "pillow-heif>=0.16",
    "pypdfium2>=4",
    "openpyxl>=3.1",
]
# The independent text layer R060 and R061 check an extraction against
# (P2.T2). Optional, and imported inside the function that uses it
# (`receipts/preprocess/ocr.py`), so a base install and the offline suite need
# neither the package nor the models it ships. `OCR_GROUNDING_ENABLED` is off
# by default, so installing this changes nothing until a deployment asks.
ocr = ["rapidocr-onnxruntime>=1.2"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
postgres = ["psycopg[binary]>=3"]
# The RQ queue worker. Optional and imported lazily (receipts/worker.py), so the
# offline test suite and a base install need neither package.
worker = ["rq>=1.16", "redis>=5"]
# The FastAPI review service. Optional so a base install and the worker stay
# light; the API tests importorskip on it exactly as the pipeline tests do.
api = ["fastapi>=0.110", "python-multipart>=0.0.9", "itsdangerous>=2", "uvicorn>=0.27"]

[project.scripts]
receipts = "receipts.cli:_console_main"

[tool.setuptools.packages.find]
# `config` (settings) lives at the repo root, a sibling of `src/`, not under
# it -- `receipts.cli` imports `config.settings` the same way the worker and
# the review API already do. The console script is the first thing that
# actually runs outside pytest's `pythonpath = ["src", "."]`, so `config` has
# to be installed too or `receipts --help` fails with `ModuleNotFoundError`
# the moment it imports `receipts.cli`. `include` keeps this scoped to the
# two packages that belong in the distribution -- `eval/` also lives at the
# root with its own `__init__.py` but is dev/research tooling, not part of
# the installed CLI, and stays out.
where = ["src", "."]
include = ["receipts*", "config*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The existing codebase makes a few deliberate, consistent style choices that
# these pyupgrade/bugbear rules would otherwise flag. The rules stay enabled in
# general; we only opt out of the patterns the code intentionally uses, so no
# existing source under src/, eval/, or tests/ needs to change.
ignore = [
    "UP035",  # imports Callable/Iterable from `typing` on purpose (not collections.abc)
    "UP037",  # quoted type annotations are used intentionally
    "UP042",  # `class X(str, Enum)` is the project's chosen enum base pattern
]

[tool.ruff.lint.per-file-ignores]
# Re-exports: names imported to build a module's public API are not "unused".
"__init__.py" = ["F401"]
# Intentional zip() over sequences known to be equal length in the align logic.
"src/receipts/validate/rules.py" = ["B905"]
# Test-file conveniences: pragmatic import order and a deliberate zip().
"tests/test_eval_metrics.py" = ["I001", "B905"]
# Imports kept for readability / import-smoke checks in this test module.
"tests/test_extractor.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
