name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev + pipeline + api dependencies
        run: pip install -e ".[dev,pipeline,api]"

      # Blocking: the test suite must pass.
      - name: Run tests
        run: python -m pytest

      # Blocking: lint must be clean.
      - name: Lint with ruff
        run: ruff check .

      # Non-blocking / informational for now: type errors do not fail CI yet.
      - name: Type-check with mypy (informational)
        run: mypy src
        continue-on-error: true
