# The gates, run on GitHub (ADR-0037).
#
# This workflow does not re-list the gates. `scripts/verify.py` IS the gate list
# (ADR-0017), and a second copy here would be one more thing to keep in
# agreement -- the previous version of this file listed pytest, ruff and mypy
# and ran **none** of the three frontend gates, so a green run said less than it
# looked like it said.
#
# `.github/workflows/` was gitignored from 2026-07-29 to 2026-08-11 at the
# user's request. ADR-0017 argued that a tracked workflow which cannot execute
# is worse than none, "because it reads as coverage". That is still true, and is
# why this file only exists now that Actions is switched back on.

name: gates

# Every branch, not just `main`. Feature branches here are pushed and then
# merged into `main` by local fast-forward, so a workflow scoped to `main`
# would only ever report *after* the merge it was supposed to gate. There is
# no `pull_request:` trigger because this repository does not use PRs -- adding
# one would produce no runs and read as coverage that does not exist.
on: [push]

jobs:
  gates:
    name: gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report both versions rather than stopping at the first failure: "3.11
      # broke and 3.13 is unknown" is a worse answer than knowing both.
      fail-fast: false
      matrix:
        # 3.11 is the floor `requires-python` declares; 3.13 is the upper end
        # of the supported range. The development interpreter is 3.14.4 and is
        # deliberately not here -- it is the one exercised locally every day.
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        # Full history, not the default single commit. `tests/test_sha_citations.py`
        # resolves every commit the documentation cites and asserts it is still
        # reachable from a ref (ADR-0042). Under `fetch-depth: 1` every citation
        # resolves as missing, so that test refuses to run rather than passing
        # vacuously -- which is the failure mode ADR-0037 was written about.
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Node 22 is the frontend build's supported major.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `dev` for pytest and ruff; `pipeline` and `api` because the suite
      # `importorskip`s on them; `openai` because seven tests in
      # `tests/test_client_factory.py` build a real `OpenAICompatClient` and
      # **fail rather than skip** without the SDK -- which is how the first CI
      # run found this, having been given only the importorskip targets.
      #
      # `anthropic` is deliberately NOT installed: the same module's docstring
      # says that path "must fail loudly with a clear RuntimeError", and it can
      # only do that while the SDK is absent. Nothing under `tests/`
      # hard-imports rq, redis or boto3, so `worker` and `postgres` stay out.
      - name: Install the project and the extras the suite needs
        run: pip install -e ".[dev,pipeline,api,openai]"

      # **The dependency-assumption guard, in both directions.**
      #
      # Present: `pytest.importorskip` turns a missing extra into a silent skip,
      # so an install that quietly dropped one would leave the suite green while
      # covering less.
      #
      # Absent: if `anthropic` ever arrives -- directly, or pulled in by
      # something else -- `test_client_factory`'s missing-SDK assertions stop
      # testing what they claim to and nothing else would notice.
      #
      # Both are membership checks rather than counts, so they do not rot as the
      # suite grows (ADR-0032 section 3).
      - name: Confirm the suite's dependency assumptions hold
        run: |
          python -c "import fastapi, cv2, openpyxl, pypdfium2, pillow_heif, openai"
          python - <<'PY'
          import importlib.util
          import sys

          if importlib.util.find_spec("anthropic") is not None:
              sys.exit(
                  "anthropic is installed, and tests/test_client_factory.py "
                  "requires it ABSENT -- see that module's docstring."
              )
          PY

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # The whole gate list, in one command, in the order ADR-0017 fixes.
      # Nothing is skipped silently: a Node gate with no npm prints
      # `SKIPPED: npm not found` naming itself, and npm is installed above.
      - name: Run the gates
        run: python scripts/verify.py

  # The `image` job that built the Dockerfile and asserted its boot contract was
  # removed on 2026-08-31 along with the Dockerfile, docker-compose.yml and
  # .dockerignore: the system runs natively on the host now (see docs/DEPLOYMENT.md,
  # "no containers"). Nothing here builds a container, so the job could only ever
  # fail on `open Dockerfile: no such file or directory`.
