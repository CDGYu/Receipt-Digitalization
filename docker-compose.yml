# Local development stack: the service itself, plus Postgres, Redis and Ollama.
#
# Start everything with:  docker compose up -d
# Or one at a time with:  docker compose up -d ollama
#
# The `api` and `worker` services run the image this repository builds
# (ADR-0036) and are for **local development only** -- see the SESSION_SECRET
# and ALLOW_INSECURE_SESSION_COOKIE notes on `api`, and docs/DEPLOYMENT.md for
# what a real deployment has to do differently.
#
# Migrations are not run by any service here. Before the first request:
#   docker compose run --rm api python -m alembic upgrade head
#
# Postgres: production and dev use Postgres; the test suite uses SQLite only,
# so this is not required to run the tests. Point the app at it with:
#   DATABASE_URL=postgresql+psycopg://receipts:receipts@localhost:5432/receipts
#
# (The psycopg driver is the optional "postgres" extra: pip install -e ".[postgres]".)
#
# Ollama: serves the local VLM. Published on 11435 to match VLM_BASE_URL in .env
# (11434 is left free for a native Ollama install). No GPU device request — the
# only GPU here is an Intel iGPU, which WSL2 cannot pass through, so inference
# is CPU-only.

services:
  postgres:
    image: postgres:16
    container_name: receipts-postgres
    environment:
      POSTGRES_USER: receipts
      POSTGRES_PASSWORD: receipts
      POSTGRES_DB: receipts
    ports:
      - "5432:5432"
    volumes:
      - receipts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipts -d receipts"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The queue broker. `receipts.asgi` refuses to boot without REDIS_URL, and
  # POST /upload enqueues through it, so this is not optional for the api
  # service the way ollama is.
  redis:
    image: redis:7-alpine
    container_name: receipts-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- the service itself ------------------------------------------------- #
  # One image, two commands (ADR-0036). `api` takes the image's default CMD;
  # `worker` overrides it. Both are built from this repository rather than
  # pulled, so `docker compose up --build` picks up local changes.
  api:
    build: .
    image: receipts
    container_name: receipts-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://receipts:receipts@postgres:5432/receipts
      REDIS_URL: redis://redis:6379/0
      # No default, deliberately: compose fails to start if it is unset rather
      # than inventing one. `install_session_middleware` would refuse anyway --
      # this just moves the failure to before the container starts.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in your .env or shell}
      # **Local development only.** This stack is plain HTTP on loopback, so the
      # Secure flag would make the session cookie unusable. `receipts.asgi`
      # refuses to boot with SESSION_COOKIE_SECURE=false unless this hatch is
      # set, which is the point: running insecure is possible, but somebody has
      # to write it down. A real deployment terminates TLS upstream and sets
      # neither of these.
      SESSION_COOKIE_SECURE: "false"
      ALLOW_INSECURE_SESSION_COOKIE: "true"
      STORAGE_ROOT: /var/receipts/blobs
    volumes:
      - receipts_blobs:/var/receipts/blobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    image: receipts
    container_name: receipts-worker
    command: ["python", "-m", "receipts.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://receipts:receipts@postgres:5432/receipts
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /var/receipts/blobs
      # The worker reads and writes the same blobs the API wrote, so it shares
      # the volume. It needs no SESSION_SECRET: it serves no HTTP and builds no
      # app -- `receipts.asgi` is never imported here.
      #
      # --- the model layer -------------------------------------------------- #
      # Without these the worker falls back to `vlm_provider="fake"` (the
      # default in config/settings.py) and every triage call raises
      # `FakeVLMClient exhausted`, which is why extract, validate, score and the
      # repair loop had never run end to end. `.env` cannot supply them: it is
      # excluded from the image by .dockerignore:45, deliberately.
      #
      # **The base URL is not the one a host uses.** On the host the Docker
      # Ollama is `localhost:11435`; inside this network it is the service name
      # and the container port, `ollama:11434`. The published 11435 exists only
      # to leave 11434 free for the Windows-native Ollama, which this project
      # does not read.
      VLM_PROVIDER: ollama
      VLM_BASE_URL: http://ollama:11434/v1
      # Ollama ignores the key; the factory's `_require` does not, and refuses
      # to build a client without one.
      VLM_API_KEY: ollama-local-unused
      # Local and CPU-only. ADR-0039 records ~1896s per receipt on this box and
      # rules local inference a liveness check, never a measurement. The
      # `:cloud` models Ollama also lists are NOT used here: cloud egress is
      # authorised for the golden set alone, and routing an uploaded receipt to
      # a hosted model is a decision nobody has taken.
      VLM_MODEL_EXTRACT: granite3.2-vision:2b
      VLM_MODEL_TRIAGE: granite3.2-vision:2b
      # The default is 120s and would abort this model mid-call: triage alone
      # measured 590s at max_edge=2048.
      #
      # **This one setting derives three others** (ADR-0054 decision 5 derives
      # them rather than fixing them). Measured by calling the real functions,
      # not by doing the arithmetic here:
      #
      #   one_call = 3600 x 3 SDK attempts       = 10800s   (3h)
      #   job ceiling (worker.job_timeout_for)   = 32580s   (9.05h)
      #   sweep started_cutoff                   = 21600s   (6h)
      #   sweep unstarted_cutoff                 = 388800s  (4.5 DAYS)
      #
      # At the 120s default those are 1260s, 720s and 3.6h, so this line
      # multiplies every one of them by 30. Two consequences, because the
      # design left landing this file open on exactly this question:
      #
      #   * **The nine-hour job ceiling is deliberate and no longer decides
      #     anything important.** `job_timeout_for`'s docstring records why:
      #     now that `receipts.sweep` carries the terminal-state guarantee,
      #     the ceiling is a resource guard on a worker slot, not the thing
      #     that decides whether an interrupted receipt is recoverable. It can
      #     afford to be generous. Before the sweep existed it could not, which
      #     is why this file was held back until ISSUE-029 and ISSUE-030 closed.
      #   * **The 4.5-day unstarted window is the one to watch.** A receipt that
      #     is enqueued and never picked up -- a dead worker -- is not swept
      #     until then, and the progress route sweeps its own row on the same
      #     clock, so a waiting screen waits just as long. That is the trade
      #     UNSTARTED_MARGIN states outright: marking a healthy queued receipt
      #     is worse than noticing a dropped one late. Lower `VLM_TIMEOUT_S`
      #     and all four numbers come down together.
      VLM_TIMEOUT_S: "3600"
    volumes:
      - receipts_blobs:/var/receipts/blobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  receipts_pgdata:
  # Shared by api and worker: the API writes an uploaded blob, the worker reads
  # it. With STORAGE_BACKEND=s3 neither needs this.
  receipts_blobs:
  # Created outside compose and already holds the pulled models (moondream);
  # declared external so compose reuses it instead of making a new empty one.
  ollama:
    external: true
